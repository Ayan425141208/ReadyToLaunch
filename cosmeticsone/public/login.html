<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glassmorphism Portfolio</title>
  <link rel="stylesheet" href="travel.css" />
  <link rel="stylesheet" href="navbar.css" />
  <link rel="stylesheet" href="login.css" />
  <style>
    *{
    margin:0;
    padding:0;
    box-sizing: border-box;
    font-family: sans-serif;
}

.container{
    align-items: center;
    display: flex;
    justify-content: center;
    height: 100%;
    width: 100%;
    
}

.form-box{
    width: 50%;
    max-width: 50%;
    height: 80%;
    background-color: #0b091b;
    border-radius: 8px;
    padding:20px 28px;
    margin-inline: 20px;
}

.form-box header h1{
    text-align: center;
    color: #5851e3;
}

.form-box form{
    margin-block: 30px;
}

input{
    width:100%;
    padding: 18px 16px;
    border: none;
    outline: none;
    border-radius: 4px;
    background-color: #a3a3a331;
    font-size: 16px;
    margin: 12px 0;
}

input[type="text"]{
    display: none;
}
a{
    text-decoration: none;
    color: #767676;
    font-size: 14px;
}

input[type="button"]{
    margin-block: 24px;
    background-color: #5851e3;
    color: #ffffff;
    font-size: 22px;
    font-weight: 700;
    border-radius: 8px;
    cursor: pointer;
    transition: .4s;
}
input[type="button"]:hover{
    background-color: #10449a;
}

.links{
    display: flex;
    justify-content: center;
}

.links a img{
    max-height: 40px;
    margin-inline: 10px;
}
.signup{
    text-align: center;
    margin-block: 20px;
}

.signup a{
    font-size: 16px;
    font-weight: 700;
    color: #5851e3;
    box-shadow: rgba(48, 255, 227, 0.25) 0px 30px 60px -12px, rgba(255, 253, 132, 0.3) 0px 18px 36px -18px;;
}

.signup a:hover{
    color: #04041d;
    text-decoration: underline 2px;
    text-underline-offset: 3.5px;
}

/* CSS to achieve responsiveness */
@media screen and (max-width:700px) {
    .form-box{
        width: 100%;
    }
}

.text-header{
    margin: 0%;
    width: 100%;
    height: auto;
    background: #04041d;
}
.link-series {
  display: flex;
  gap: 40px;
}

.link-option {
  text-decoration: none;
  color: white;
  font-size: 1.5rem;
  padding: 10px 20px;
  border-radius: 10px;
  position: relative;
  overflow: hidden;
  transition: background 0.3s, color 0.3s;
}

.link-option::after {
  content: '';
  position: absolute;
  left: 0;
  bottom: 0;
  height: 100%;
  width: 0%;
  background: rgba(255, 255, 255, 0.1);
  z-index: 0;
  transition: width 0.3s ease-in-out;
}

.link-option:hover::after {
  width: 100%;
}

.link-option:hover {
  color: #ffd700;
  cursor: pointer;
}
  </style>
</head>
<body>
    <form action="/login" method="GET">
    <section>
      <video src="water.mp4" autoplay muted loop></video>
       <div class="glass-card" id="card">
          <h1>TRAVEL PORTE.</h1>
          <p style="color: rgb(174, 255, 231);
                    font-family: 'Times New Roman', Times, serif;
                    font-size: 18px;
                    font-style: italic;">You are near to fullfil your dream</p>
            
        <div class="container">       
           <div class="form-box">
                <header>
                    <h1 id="title">Login</h1>
                </header>
                <form action="">
                    <input type="text" placeholder="Name" id="nameField">
                    <input type="email" placeholder="Username or Email address">

                    <input type="password" placeholder="Password">
                    <a href="">Forgot Password?</a>
                    <input type="button" value="Login" id="signinBtn">

                    <div class="links">
                        <a href="#"><img src="./assets/fb.png" alt=""></a>
                        <a href="#"><img src="./assets/twitter.png" alt=""></a>
                        <a href="#"><img src="./assets/goggle.png" alt=""></a>
                    </div>
                    <p class="signup">Not a member?<a href="#" id="signupBtn">Sign Up</a></p>
                </form>
            </div>
          </div>
       </div>
    </div>
    </section>
        <header>
           <div class="text-header">
                <h1>Touro Fantacy.</h1><br><br>
           </div>
           <div class="link-series">
                <a href="#" class="link-option">Home</a>
                <a href="#" class="link-option">Packages</a>
                <a href="#" class="link-option">Destinations</a>
                <a href="#" class="link-option">Contact</a>
            </div>
            
        </header> 
          
    <script>
        const title = document.getElementById('title');
        const nameField = document.getElementById('nameField');
        const signinBtn = document.getElementById('signinBtn');
        const signupBtn = document.getElementById('signupBtn');

        signupBtn.onclick = function(){
            title.innerHTML = "Sign Up";
            nameField.style.display = "block";
        }
        signinBtn.onclick = function(){
            title.innerHTML = "Login";
            nameField.style.display = "none";
        }
    </script>
    </form>
</body>
</html>
